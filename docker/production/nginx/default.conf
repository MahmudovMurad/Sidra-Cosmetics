upstream backend {
    server sidra-web:8000;
}

# Redirect all HTTP -> HTTPS
server {
    listen 80;
    server_name sidra-kozmetik.com;

    # Allow certbot to verify domain over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name sidra-kozmetik.com;

    client_max_body_size 1G;

    # SSL certificates (auto-renewed by certbot)
    ssl_certificate /etc/letsencrypt/live/sidra-kozmetik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sidra-kozmetik.com/privkey.pem;

    # Recommended security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Proxy pass to Django backend
    location / {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # Static files
    location /staticfiles/ {
        alias /code/sidra/staticfiles/;
    }

    # Media files
    location /mediafiles/ {
        alias /code/sidra/mediafiles/;
    }

    # Allow Certbot renewals without disabling HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
